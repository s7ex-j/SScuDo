name = "sscudo-reportes"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# La vista previa usa @cloudflare/puppeteer, que necesita las APIs de Node.
compatibility_flags = ["nodejs_compat"]

[vars]
# Orígenes que pueden ENVIAR reportes (separados por coma). Leer la lista es público.
ORIGENES = "https://s7ex-j.github.io,https://appassets.androidplatform.net,http://localhost:5180"
# Cuántas personas distintas deben reportar un dominio antes de mostrarlo.
UMBRAL = "3"

[[d1_databases]]
binding = "DB"
database_name = "sscudo"
database_id = "PENDIENTE"  # lo imprime `wrangler d1 create sscudo`

# Navegador de Cloudflare (Browser Rendering) para la vista previa de /pagina.
# En el plan gratuito tiene un cupo diario; si se acaba, /pagina responde sin captura.
[browser]
binding = "NAVEGADOR"

# Secretos (no van aquí): `wrangler secret put SAL` y `wrangler secret put ADMIN`
